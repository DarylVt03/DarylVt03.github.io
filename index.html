<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso</title>

    <style>

        /* ==========================================
           ESTILO GENERAL
           ========================================== */

        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20vh;
        }


        /* ==========================================
           CAMPO DE CONTRASEÑA
           ========================================== */

        input {
            padding: 12px;
            font-size: 18px;
            margin: 10px;
        }


        /* ==========================================
           BOTONES
           ========================================== */

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }


        /* ==========================================
           INDICACIÓN DE LOS 8 DÍGITOS
           ========================================== */

        #indicacion {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }


        /* ==========================================
           MENSAJES
           ========================================== */

        #mensaje {
            margin-top: 20px;
            font-size: 18px;
        }


        /* ==========================================
           CUENTA ATRÁS ENTRE INTENTOS
           ========================================== */

        #contador {
            color: #888;
            font-size: 14px;
            margin-top: 15px;
        }


        /* ==========================================
           PISTA ESCRITA
           ========================================== */

        #pista {
            display: none;

            margin: 30px auto;
            max-width: 600px;
            padding: 20px;

            border: 1px solid #555;

            color: #ccc;
            font-size: 16px;
            line-height: 1.5;
        }


        /* ==========================================
           BOTÓN PARA REPETIR EL AUDIO
           ========================================== */

        #botonReproducir {
            display: none;
            margin-top: 20px;
        }

    </style>
</head>


<body>

    <!-- ==========================================
         TÍTULO
         ========================================== -->

    <h1>Introduce la contraseña</h1>


    <!-- ==========================================
         CONTRASEÑA
         ========================================== -->

    <input
        type="password"
        id="password"
        placeholder="Contraseña"
        autocomplete="off"
        inputmode="numeric"
        maxlength="8"
    >


    <!-- Indicación de los 8 dígitos -->

    <p id="indicacion">
        La contraseña tiene 8 dígitos
    </p>


    <br>


    <!-- ==========================================
         BOTÓN ENTRAR
         ========================================== -->

    <button
        id="boton"
        onclick="comprobarPassword()"
    >
        Entrar
    </button>


    <!-- ==========================================
         MENSAJE
         ========================================== -->

    <p id="mensaje"></p>


    <!-- ==========================================
         CUENTA ATRÁS
         ========================================== -->

    <p id="contador"></p>


    <!-- ==========================================
         PISTA ESCRITA
         ========================================== -->

    <div id="pista">

        Revisa una de los objetos que se te proporcionaron
        al principio, el cual no has usado hasta el momento,
        uno de los datos que aparecen debes cambiarlo de formato

    </div>


    <!-- ==========================================
         BOTÓN PARA REPETIR LA PISTA
         ========================================== -->

    <button
        id="botonReproducir"
        onclick="reproducirPista()"
        disabled
    >
        🔊 Reproducir pista de nuevo
    </button>


    <!-- ==========================================
         AUDIO
         ========================================== -->

    <audio id="audioPista">

        <source
            src="audioPista.mp3"
            type="audio/mpeg"
        >

        Tu navegador no soporta audio.

    </audio>


    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script>


        /* ==========================================
           CONFIGURACIÓN
           ========================================== */

        const CONTRASENA = "12101935";

        let intentos = 0;

        let bloqueado = false;


        /* ==========================================
           COMPROBAR CONTRASEÑA
           ========================================== */

        function comprobarPassword() {

            // Si está bloqueado, no hacemos nada
            if (bloqueado) {
                return;
            }


            // Obtener elementos
            const password =
                document.getElementById("password").value;

            const mensaje =
                document.getElementById("mensaje");

            const audioPista =
                document.getElementById("audioPista");

            const botonReproducir =
                document.getElementById("botonReproducir");


            /* ======================================
               CONTRASEÑA CORRECTA
               ====================================== */

            if (password === CONTRASENA) {

                mensaje.textContent =
                    "Obtienes acceso al dormitorio principal y al baño";

                mensaje.style.color = "#6f6";


                // Reiniciar contador
                intentos = 0;


                // Mostrar botón de repetir
                botonReproducir.style.display =
                    "inline-block";


                // Bloquear mientras suena
                botonReproducir.disabled = true;


                // Reiniciar audio
                audioPista.currentTime = 0;


                // Reproducir audio
                audioPista.play();


                return;
            }


            /* ======================================
               CONTRASEÑA INCORRECTA
               ====================================== */

            intentos++;


            mensaje.textContent =
                "Contraseña incorrecta";

            mensaje.style.color = "#f66";


            // Limpiar contraseña
            document.getElementById("password").value = "";


            /* ======================================
               MOSTRAR PISTA TRAS 5 INTENTOS
               ====================================== */

            if (intentos >= 3) {

                document.getElementById("pista").style.display =
                    "block";

            }


            /* ======================================
               ESPERAR 5 SEGUNDOS
               ====================================== */

            iniciarEspera();

        }


        /* ==========================================
           ESPERA ENTRE INTENTOS
           ========================================== */

        function iniciarEspera() {

            bloqueado = true;


            const boton =
                document.getElementById("boton");

            const contador =
                document.getElementById("contador");


            // Desactivar botón
            boton.disabled = true;


            let segundos = 5;


            contador.textContent =
                "Espera " +
                segundos +
                " segundos para volver a intentarlo.";


            const intervalo =
                setInterval(function() {

                    segundos--;


                    if (segundos > 0) {

                        contador.textContent =
                            "Espera " +
                            segundos +
                            " segundos para volver a intentarlo.";

                    }

                    else {

                        clearInterval(intervalo);


                        // Volver a permitir intentos
                        bloqueado = false;


                        boton.disabled = false;


                        contador.textContent =
                            "Ya puedes volver a intentarlo.";

                    }

                }, 1000);

        }


        /* ==========================================
           REPRODUCIR PISTA DE NUEVO
           ========================================== */

        function reproducirPista() {

            const audioPista =
                document.getElementById("audioPista");

            const botonReproducir =
                document.getElementById("botonReproducir");


            // Bloquear botón mientras suena
            botonReproducir.disabled = true;


            // Volver al principio
            audioPista.currentTime = 0;


            // Reproducir
            audioPista.play();

        }


        /* ==========================================
           CUANDO TERMINA EL AUDIO
           ========================================== */

        document
            .getElementById("audioPista")
            .addEventListener(
                "ended",
                function() {

                    const botonReproducir =
                        document.getElementById(
                            "botonReproducir"
                        );


                    // Volver a permitir reproducir
                    botonReproducir.disabled = false;

                }
            );


        /* ==========================================
           PERMITIR ENTER PARA ENVIAR
           ========================================== */

        document
            .getElementById("password")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        comprobarPassword();

                    }

                }
            );

    </script>

</body>
</html>
